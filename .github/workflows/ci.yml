name: Build portfolio

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=moderate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: project-showcase-captures
          path: test-results/showcase/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: portfolio-browser-failure
          path: test-results/
